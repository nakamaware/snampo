# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI - Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "firebase/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "firebase/**"
      - ".github/workflows/ci-frontend.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Frontend Setup
        uses: ./.github/actions/setup-frontend
      - name: Format check
        run: dart format --set-exit-if-changed .

  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Frontend Setup
        uses: ./.github/actions/setup-frontend
      - name: Analyze
        run: flutter analyze --no-fatal-infos

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Frontend Setup
        uses: ./.github/actions/setup-frontend
      - name: Test
        run: |
          # テストがない状態で実行するとエラーになるので、テストが存在するかを確認してから実行する
          if flutter test --list-tests > /dev/null 2>&1 && [ -n "$(flutter test --list-tests 2>/dev/null)" ]; then
            flutter test --coverage
          else
            echo "No tests found. Skipping test execution."
          fi

  rules-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # firebase/.mise.toml と揃える
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - name: Setup Java
        # firebase/.mise.toml と同じ。エミュレータは Java 21 以上が必要
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Security Rules test
        # firebase emulators:exec でエミュレータを起動して Rules をテストする
        run: npm test
